<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoofBoard — User Management</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; min-height: 100vh; color: #111; }
.header { display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 0.5px solid #e0e0e0; padding: 10px 20px; }
.logo { font-size: 18px; font-weight: 600; color: #111; letter-spacing: -0.5px; }
.logo span { color: #185FA5; }
.header-right { display: flex; align-items: center; gap: 8px; }
.user-chip { font-size: 12px; color: #555; background: #f0f0ec; padding: 4px 10px; border-radius: 10px; }
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; font-family: inherit; border: none; cursor: pointer; }
.btn-primary { background: #185FA5; color: #fff; }
.btn-primary:hover { background: #124d8a; }
.btn-ghost { background: #f0f0ec; color: #444; border: 0.5px solid #ccc; }
.btn-ghost:hover { background: #e8e8e4; }
.btn-danger { background: #D85A30; color: #fff; }
.content { max-width: 800px; margin: 30px auto; padding: 0 20px; }
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: #888; margin-bottom: 24px; }
.user-card { background: #fff; border: 0.5px solid #e0e0e0; border-radius: 10px; padding: 14px 18px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.user-card.inactive { opacity: 0.5; }
.user-info { flex: 1; }
.user-name { font-size: 14px; font-weight: 600; }
.user-username { font-size: 12px; color: #888; margin-top: 1px; }
.role-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
.role-admin        { background: #DEEDFB; color: #0C447C; }
.role-scheduler    { background: #E8E6FD; color: #3C3489; }
.role-office_staff { background: #DCF0CC; color: #27500A; }
.role-sales        { background: #F8E9C8; color: #633806; }
.user-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn { width: 30px; height: 30px; border-radius: 6px; border: 0.5px solid #ddd; background: #f8f8f5; color: #666; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; }
.icon-btn:hover { background: #fff; color: #111; }
.icon-btn.del:hover { background: #FDE6D8; color: #D85A30; }
.inactive-tag { font-size: 10px; font-weight: 700; color: #aaa; background: #f0f0ec; padding: 2px 7px; border-radius: 8px; }
.last-login { font-size: 11px; color: #bbb; }

/* Modal */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
.overlay.open { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 440px; max-width: 98vw; }
.modal-hdr { padding: 16px 20px; border-bottom: 0.5px solid #eee; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-ftr { padding: 14px 20px; border-top: 0.5px solid #eee; display: flex; justify-content: flex-end; gap: 8px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label.lbl { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
input.fi, select.fi { padding: 9px 10px; border: 0.5px solid #d0d0cc; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fff; color: #111; outline: none; width: 100%; }
input.fi:focus, select.fi:focus { border-color: #185FA5; }
.hint { font-size: 11px; color: #aaa; }
.err { font-size: 12px; font-weight: 600; color: #D85A30; display: none; }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="logo">Roof<span>Board</span></div>
    <span style="font-size:12px;font-weight:700;color:#fff;background:#185FA5;padding:3px 11px;border-radius:12px;">User Management</span>
  </div>
  <div class="header-right">
    <span class="user-chip" id="user-chip"></span>
    <button class="btn btn-ghost" onclick="window.location.href='roofboard_database.html'"><i class="ti ti-arrow-left"></i> Back to Database</button>
    <button class="btn btn-ghost" onclick="logout()"><i class="ti ti-logout"></i> Sign out</button>
  </div>
</div>

<div class="content">
  <div class="page-title">Users</div>
  <div class="page-sub">Manage who has access to RoofBoard and what they can do.</div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
    <button class="btn btn-primary" onclick="openAdd()"><i class="ti ti-plus"></i> Add User</button>
  </div>
  <div id="user-list"></div>
</div>

<!-- Add/Edit modal -->
<div class="overlay" id="user-modal" onclick="maybeClose(event)">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="modal-title">Add User</div>
      <button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-group">
          <label class="lbl">Full Name</label>
          <input type="text" class="fi" id="f-name" placeholder="Jane Smith">
        </div>
        <div class="form-group">
          <label class="lbl">Username *</label>
          <input type="text" class="fi" id="f-username" placeholder="janesmith" autocomplete="off">
        </div>
      </div>
      <div class="form-group">
        <label class="lbl">Role *</label>
        <select class="fi" id="f-role">
          <option value="admin">Admin — full access + user management</option>
          <option value="scheduler">Scheduler — full job access including dates</option>
          <option value="office_staff">Office Staff — full edit except dates</option>
          <option value="sales">Sales — view + edit notes only</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="lbl" id="pwd-label">Password *</label>
          <input type="password" class="fi" id="f-pwd" placeholder="Min 8 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="lbl">Confirm Password</label>
          <input type="password" class="fi" id="f-pwd2" placeholder="Repeat password" autocomplete="new-password">
        </div>
      </div>
      <div class="hint" id="pwd-hint">User will be prompted to change password on first login.</div>
      <div class="form-group" id="active-row" style="display:none;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
          <input type="checkbox" id="f-active" style="width:15px;height:15px;"> Account active
        </label>
      </div>
      <div class="err" id="modal-err"></div>
    </div>
    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="save-user-btn" onclick="saveUser()"><i class="ti ti-device-floppy"></i> Save</button>
    </div>
  </div>
</div>

<script>
const API = 'https://lgrroofboard-api-production.up.railway.app';

function getToken(){ return localStorage.getItem('rb_token'); }
async function authFetch(method, path, body){
  const opts={method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  if(r.status===401){ window.location.href='roofboard_login.html'; throw new Error('Unauth'); }
  return r;
}

// ── Role display ──────────────────────────────────────────────
const ROLE_LABELS = {
  admin:'Admin', scheduler:'Scheduler',
  office_staff:'Office Staff', sales:'Sales'
};
function roleBadge(role){
  return `<span class="role-badge role-${role}">${ROLE_LABELS[role]||role}</span>`;
}
function fmtDate(d){ if(!d)return'Never'; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

// ── Load users ────────────────────────────────────────────────
let users=[], currentUserId='';

async function loadUsers(){
  try {
    const me = await (await authFetch('GET','/api/auth/me')).json();
    currentUserId = me.id;
    document.getElementById('user-chip').textContent = me.fullName||me.username;

    const r = await authFetch('GET','/api/users');
    users = await r.json();
    renderUsers();
  } catch(e){ if(e.message!=='Unauth') console.error(e); }
}

function renderUsers(){
  document.getElementById('user-list').innerHTML = users.map(u=>`
    <div class="user-card${u.active?'':' inactive'}">
      <div class="user-info">
        <div class="user-name">${u.fullName||u.username} ${!u.active?'<span class="inactive-tag">Inactive</span>':''}</div>
        <div class="user-username">@${u.username} &nbsp;·&nbsp; Last login: ${fmtDate(u.lastLogin)}</div>
      </div>
      ${roleBadge(u.role)}
      <div class="user-actions">
        <div class="icon-btn" onclick="openEdit('${u.id}')" title="Edit"><i class="ti ti-edit"></i></div>
        ${u.id!==currentUserId?`<div class="icon-btn del" onclick="deleteUser('${u.id}','${u.fullName||u.username}')" title="Delete"><i class="ti ti-trash"></i></div>`:''}
      </div>
    </div>
  `).join('');
}

// ── Add / Edit ────────────────────────────────────────────────
function openAdd(){
  document.getElementById('modal-title').textContent='Add User';
  document.getElementById('edit-id').value='';
  document.getElementById('f-name').value='';
  document.getElementById('f-username').value='';
  document.getElementById('f-username').disabled=false;
  document.getElementById('f-role').value='office_staff';
  document.getElementById('f-pwd').value='';
  document.getElementById('f-pwd2').value='';
  document.getElementById('pwd-label').textContent='Password *';
  document.getElementById('pwd-hint').textContent='User will be prompted to change password on first login.';
  document.getElementById('active-row').style.display='none';
  document.getElementById('modal-err').style.display='none';
  document.getElementById('user-modal').classList.add('open');
}
function openEdit(id){
  const u=users.find(x=>x.id===id); if(!u) return;
  document.getElementById('modal-title').textContent='Edit User';
  document.getElementById('edit-id').value=id;
  document.getElementById('f-name').value=u.fullName||'';
  document.getElementById('f-username').value=u.username;
  document.getElementById('f-username').disabled=true;
  document.getElementById('f-role').value=u.role;
  document.getElementById('f-pwd').value='';
  document.getElementById('f-pwd2').value='';
  document.getElementById('pwd-label').textContent='New Password (leave blank to keep current)';
  document.getElementById('pwd-hint').textContent='Only fill in if you want to reset this user\'s password.';
  document.getElementById('active-row').style.display='block';
  document.getElementById('f-active').checked=u.active;
  document.getElementById('modal-err').style.display='none';
  document.getElementById('user-modal').classList.add('open');
}

async function saveUser(){
  const eid=document.getElementById('edit-id').value;
  const name=document.getElementById('f-name').value.trim();
  const username=document.getElementById('f-username').value.trim();
  const role=document.getElementById('f-role').value;
  const pwd=document.getElementById('f-pwd').value;
  const pwd2=document.getElementById('f-pwd2').value;
  const active=document.getElementById('f-active').checked;
  const errEl=document.getElementById('modal-err');
  errEl.style.display='none';

  if(!eid&&(!username||!pwd)){ showErr('Username and password are required.'); return; }
  if(pwd&&pwd.length<8){ showErr('Password must be at least 8 characters.'); return; }
  if(pwd&&pwd!==pwd2){ showErr('Passwords do not match.'); return; }

  const btn=document.getElementById('save-user-btn');
  btn.disabled=true;

  try {
    let r;
    if(eid){
      const body={role,fullName:name,active};
      if(pwd) body.password=pwd;
      r=await authFetch('PATCH',`/api/users/${eid}`,body);
    } else {
      r=await authFetch('POST','/api/users',{username,password:pwd,role,fullName:name});
    }
    const data=await r.json();
    if(!r.ok){ showErr(data.error||'Save failed'); btn.disabled=false; return; }
    closeModal();
    await loadUsers();
  } catch(e){ if(e.message!=='Unauth'){ showErr('Save failed: '+e.message); } }
  btn.disabled=false;
}

async function deleteUser(id, name){
  if(!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
  try {
    const r=await authFetch('DELETE',`/api/users/${id}`);
    if(!r.ok){ const d=await r.json(); alert(d.error||'Delete failed'); return; }
    await loadUsers();
  } catch(e){ if(e.message!=='Unauth') alert('Delete failed'); }
}

function showErr(msg){ const e=document.getElementById('modal-err');e.textContent=msg;e.style.display='block'; }
function closeModal(){ document.getElementById('user-modal').classList.remove('open'); }
function maybeClose(e){ if(e.target===document.getElementById('user-modal')) closeModal(); }

async function logout(){
  try { await authFetch('POST','/api/auth/logout'); } catch(e){}
  localStorage.removeItem('rb_token');
  localStorage.removeItem('rb_role');
  localStorage.removeItem('rb_name');
  localStorage.removeItem('rb_expires');
  window.location.href='roofboard_login.html';
}

// ── Auth check ────────────────────────────────────────────────
const token=localStorage.getItem('rb_token');
const expires=localStorage.getItem('rb_expires');
const role=localStorage.getItem('rb_role');
if(!token||!expires||new Date(expires)<=new Date()){
  window.location.href='roofboard_login.html';
} else if(role!=='admin'){
  window.location.href='roofboard_database.html';
} else {
  loadUsers();
}
</script>
</body>
</html>
