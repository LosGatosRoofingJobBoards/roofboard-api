<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RoofBoard — Users</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="roofboard_config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; min-height: 100vh; color: #111; }
.header { display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 0.5px solid #e0e0e0; padding: 10px 20px; flex-wrap: wrap; gap: 8px; }
.logo { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
.logo span { color: #185FA5; }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; border: none; cursor: pointer; white-space: nowrap; }
.btn-primary { background: #185FA5; color: #fff; }
.btn-primary:hover { background: #124d8a; }
.btn-ghost { background: #f0f0ec; color: #444; border: 0.5px solid #ccc; }
.btn-ghost:hover { background: #e8e8e4; }
.content { max-width: 820px; margin: 24px auto; padding: 0 16px; }
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: #888; margin-bottom: 20px; }
.user-card { background: #fff; border: 0.5px solid #e0e0e0; border-radius: 10px; padding: 14px 18px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.user-card.inactive { opacity: 0.5; }
.user-info { flex: 1; min-width: 150px; }
.user-name { font-size: 14px; font-weight: 600; }
.user-meta { font-size: 12px; color: #888; margin-top: 2px; }
.role-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
.user-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.icon-btn { width: 32px; height: 32px; border-radius: 6px; border: 0.5px solid #ddd; background: #f8f8f5; color: #666; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
.icon-btn:hover { background: #fff; color: #111; }
.icon-btn.del:hover { background: #FDE6D8; color: #D85A30; }
.inactive-tag { font-size: 10px; font-weight: 700; color: #aaa; background: #f0f0ec; padding: 2px 7px; border-radius: 8px; margin-left: 6px; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
.overlay.open { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 460px; max-width: 98vw; margin: auto; }
.modal-hdr { padding: 16px 20px; border-bottom: 0.5px solid #eee; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 75vh; overflow-y: auto; }
.modal-ftr { padding: 14px 20px; border-top: 0.5px solid #eee; display: flex; justify-content: flex-end; gap: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
label.lbl { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
input.fi, select.fi { padding: 10px 12px; border: 0.5px solid #d0d0cc; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: #111; outline: none; width: 100%; -webkit-appearance: none; }
input.fi:focus, select.fi:focus { border-color: #185FA5; }
.hint { font-size: 11px; color: #aaa; }
.err { font-size: 12px; font-weight: 600; color: #D85A30; display: none; padding: 8px 10px; background: #FEF0E6; border-radius: 6px; }
.check-label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check-label input { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="logo">Roof<span>Board</span></div>
    <span style="font-size:12px;font-weight:700;color:#fff;background:#185FA5;padding:3px 11px;border-radius:12px;">Users</span>
  </div>
  <div class="header-right">
    <span id="user-chip" style="font-size:12px;color:#555;background:#f0f0ec;padding:4px 10px;border-radius:10px;"></span>
    <button class="btn btn-ghost" onclick="window.location.href='roofboard_database.html'"><i class="ti ti-arrow-left"></i> Database</button>
    <button class="btn btn-ghost" onclick="window.location.href='roofboard_crews.html'"><i class="ti ti-users-group"></i> Crews</button>
    <button class="btn btn-ghost" onclick="logout()"><i class="ti ti-logout"></i> Sign out</button>
  </div>
</div>

<div class="content">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
    <div>
      <div class="page-title">Users</div>
      <div class="page-sub">Manage who has access to RoofBoard and what they can do.</div>
    </div>
    <button class="btn btn-primary" onclick="openAdd()"><i class="ti ti-plus"></i> Add User</button>
  </div>
  <div id="user-list"></div>
</div>

<div class="overlay" id="user-modal" onclick="maybeClose(event)">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-title" id="modal-title">Add User</div>
      <button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-group">
          <label class="lbl">Full Name</label>
          <input type="text" class="fi" id="f-name" placeholder="Jane Smith">
        </div>
        <div class="form-group">
          <label class="lbl">Username *</label>
          <input type="text" class="fi" id="f-username" placeholder="janesmith" autocomplete="off" autocapitalize="none">
        </div>
      </div>
      <div class="form-group">
        <label class="lbl">Role *</label>
        <select class="fi" id="f-role">
          <option value="admin">Admin — full access + user management</option>
          <option value="scheduler">Scheduler — full job access including dates &amp; crews</option>
          <option value="office_staff">Office Staff — full edit except scheduling dates</option>
          <option value="sales">Roofing Consultant — view + notes &amp; approval only</option>
          <option value="removal_foreman">Removal Foreman — view + assign removal crew only</option>
          <option value="supplier">Supplier — view only, no edits</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="lbl" id="pwd-label">Password *</label>
          <input type="password" class="fi" id="f-pwd" placeholder="Min 8 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="lbl">Confirm Password</label>
          <input type="password" class="fi" id="f-pwd2" placeholder="Repeat password" autocomplete="new-password">
        </div>
      </div>
      <div class="hint" id="pwd-hint">User will be prompted to change password on first login.</div>
      <div class="form-group" id="active-row" style="display:none;">
        <label class="check-label"><input type="checkbox" id="f-active"> Account active</label>
      </div>
      <div class="err" id="modal-err"></div>
    </div>
    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="save-user-btn" onclick="saveUser()"><i class="ti ti-device-floppy"></i> Save</button>
    </div>
  </div>
</div>

<script>
function getToken(){ return localStorage.getItem('rb_token'); }
async function authFetch(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(RB_API+path,opts);
  if(r.status===401){logout();throw new Error('Unauth');}
  return r;
}
function fmtDate(d){ if(!d)return'Never'; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

let users=[], currentUserId='';

async function loadUsers(){
  try {
    const me=await (await authFetch('GET','/api/auth/me')).json();
    currentUserId=me.id;
    document.getElementById('user-chip').textContent=(me.fullName||me.username)+' · '+(ROLE_LABELS[me.role]||me.role);
    users=await (await authFetch('GET','/api/users')).json();
    renderUsers();
  } catch(e){ if(e.message!=='Unauth') console.error(e); }
}

function renderUsers(){
  document.getElementById('user-list').innerHTML=users.map(u=>{
    const rc=ROLE_COLORS[u.role]||{bg:'#f0f0ec',text:'#888'};
    return `<div class="user-card${u.active?'':' inactive'}">
      <div class="user-info">
        <div class="user-name">${u.fullName||u.username}${!u.active?'<span class="inactive-tag">Inactive</span>':''}</div>
        <div class="user-meta">@${u.username} &nbsp;·&nbsp; Last login: ${fmtDate(u.lastLogin)}</div>
      </div>
      <span class="role-badge" style="background:${rc.bg};color:${rc.text}">${ROLE_LABELS[u.role]||u.role}</span>
      <div class="user-actions">
        <div class="icon-btn" onclick="openEdit('${u.id}')"><i class="ti ti-edit"></i></div>
        ${u.id!==currentUserId?`<div class="icon-btn del" onclick="deleteUser('${u.id}','${u.fullName||u.username}')"><i class="ti ti-trash"></i></div>`:''}
      </div>
    </div>`;
  }).join('');
}

function openAdd(){
  document.getElementById('modal-title').textContent='Add User';
  document.getElementById('edit-id').value='';
  document.getElementById('f-name').value='';
  document.getElementById('f-username').value='';
  document.getElementById('f-username').disabled=false;
  document.getElementById('f-role').value='office_staff';
  document.getElementById('f-pwd').value='';
  document.getElementById('f-pwd2').value='';
  document.getElementById('pwd-label').textContent='Password *';
  document.getElementById('pwd-hint').textContent="User will be prompted to change password on first login.";
  document.getElementById('active-row').style.display='none';
  document.getElementById('modal-err').style.display='none';
  document.getElementById('user-modal').classList.add('open');
}
function openEdit(id){
  const u=users.find(x=>x.id===id);if(!u)return;
  document.getElementById('modal-title').textContent='Edit User';
  document.getElementById('edit-id').value=id;
  document.getElementById('f-name').value=u.fullName||'';
  document.getElementById('f-username').value=u.username;
  document.getElementById('f-username').disabled=true;
  document.getElementById('f-role').value=u.role;
  document.getElementById('f-pwd').value='';
  document.getElementById('f-pwd2').value='';
  document.getElementById('pwd-label').textContent='New Password (leave blank to keep current)';
  document.getElementById('pwd-hint').textContent="Only fill in if you want to reset this user's password.";
  document.getElementById('active-row').style.display='block';
  document.getElementById('f-active').checked=u.active;
  document.getElementById('modal-err').style.display='none';
  document.getElementById('user-modal').classList.add('open');
}

async function saveUser(){
  const eid=document.getElementById('edit-id').value;
  const name=document.getElementById('f-name').value.trim();
  const username=document.getElementById('f-username').value.trim();
  const role=document.getElementById('f-role').value;
  const pwd=document.getElementById('f-pwd').value;
  const pwd2=document.getElementById('f-pwd2').value;
  const active=document.getElementById('f-active').checked;
  const errEl=document.getElementById('modal-err');
  errEl.style.display='none';
  if(!eid&&(!username||!pwd)){showErr('Username and password are required.');return;}
  if(pwd&&pwd.length<8){showErr('Password must be at least 8 characters.');return;}
  if(pwd&&pwd!==pwd2){showErr('Passwords do not match.');return;}
  const btn=document.getElementById('save-user-btn');
  btn.disabled=true;
  try {
    let r;
    if(eid){ const body={role,fullName:name,active}; if(pwd) body.password=pwd; r=await authFetch('PATCH',`/api/users/${eid}`,body); }
    else { r=await authFetch('POST','/api/users',{username,password:pwd,role,fullName:name}); }
    const data=await r.json();
    if(!r.ok){showErr(data.error||'Save failed');btn.disabled=false;return;}
    closeModal(); await loadUsers();
  } catch(e){ if(e.message!=='Unauth'){showErr('Save failed: '+e.message);} }
  btn.disabled=false;
}

async function deleteUser(id,name){
  if(!confirm(`Delete user "${name}"? This cannot be undone.`))return;
  try { const r=await authFetch('DELETE',`/api/users/${id}`); if(!r.ok){const d=await r.json();alert(d.error||'Delete failed');return;} await loadUsers(); }
  catch(e){ if(e.message!=='Unauth') alert('Delete failed'); }
}

function showErr(msg){ const e=document.getElementById('modal-err');e.textContent=msg;e.style.display='block'; }
function closeModal(){ document.getElementById('user-modal').classList.remove('open'); }
function maybeClose(e){ if(e.target===document.getElementById('user-modal')) closeModal(); }

function logout(){
  try{fetch(RB_API+'/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+getToken()}});}catch(e){}
  ['rb_token','rb_role','rb_name','rb_expires'].forEach(k=>localStorage.removeItem(k));
  window.location.href='roofboard_login.html';
}

const token=localStorage.getItem('rb_token'),expires=localStorage.getItem('rb_expires'),role=localStorage.getItem('rb_role');
if(!token||!expires||new Date(expires)<=new Date()) window.location.href='roofboard_login.html';
else if(role!=='admin') window.location.href='roofboard_database.html';
else loadUsers();
</script>
</body>
</html>
