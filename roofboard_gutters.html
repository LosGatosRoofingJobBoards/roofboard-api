<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoofBoard — Gutters</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="roofboard_config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; min-height: 100vh; padding: 12px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #fff; border-radius: 10px; border: 0.5px solid #e0e0e0; padding: 9px 14px; flex-wrap: wrap; gap: 6px; }
.logo { font-size: 17px; font-weight: 600; letter-spacing: -0.5px; }
.logo span { color: #1D9E75; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #1D9E75; display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
select.rc-filter { padding: 5px 10px; border: 0.5px solid #d0d0cc; border-radius: 8px; font-size: 12px; font-family: inherit; background: #f8f8f5; color: #111; outline: none; cursor: pointer; }
.crew-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.crew-btn { padding: 5px 13px; border-radius: 18px; border: 0.5px solid #ccc; background: #f0f0ec; font-size: 12px; color: #555; cursor: pointer; font-family: inherit; }
.crew-btn.active { color: #fff; border-color: transparent; font-weight: 600; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.nav-btn { width: 28px; height: 28px; border-radius: 7px; border: 0.5px solid #ccc; background: #f0f0ec; color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; font-size: 15px; }
.nav-btn:hover { background: #fff; }
.month-title { font-size: 16px; font-weight: 600; color: #111; min-width: 150px; text-align: center; }
.job-count-label { font-size: 12px; color: #888; }
.dow-row { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 2px; margin-bottom: 2px; }
.dow-cell { text-align: center; font-size: 10px; font-weight: 600; color: #888; padding: 4px 0; text-transform: uppercase; letter-spacing: 0.4px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 2px; }
.cal-day { background: #fff; border: 0.5px solid #e4e4e0; border-radius: 7px; min-height: 135px; padding: 5px; overflow: hidden; }
.cal-day.other-month { background: #f8f8f5; opacity: 0.5; }
.cal-day.today { border: 2px solid #1D9E75; }
.cal-day.weekend { background: #f8f8f5; }
.day-num { font-size: 11px; font-weight: 600; color: #999; margin-bottom: 4px; }
.cal-day.today .day-num { color: #1D9E75; }
.job-pill { border-radius: 4px; padding: 3px 5px; margin-bottom: 3px; font-size: 11px; font-weight: 600; cursor: pointer; border-left: 3px solid transparent; overflow: hidden; }
.job-pill:hover { opacity: 0.78; }
.job-pill.waiting { border-left-style: dashed; opacity: 0.85; }
.job-pill.not-approved { outline: 2px solid #D85A30; outline-offset: -1px; }
.pill-r1 { display: flex; align-items: center; gap: 2px; overflow: hidden; }
.pill-num { font-size: 9px; font-weight: 800; opacity: 0.6; flex-shrink: 0; }
.pill-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.pill-r2 { display: flex; gap: 2px; margin-top: 2px; flex-wrap: wrap; }
.ptag { font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
.tag-profile      { background: #EAF7F2; color: #0F6E56; }
.tag-confirmed    { background: #D5F0E8; color: #085041; }
.tag-not-approved { background: #FDE6D8; color: #712B13; }
.tag-pending      { background: #f0f0ec; color: #999; }
.tag-rc           { background: #EAF2FB; color: #185FA5; }
.tag-steep        { background: #FEF0E0; color: #A04000; border: 1px solid #F0A500; }
.tag-existing     { background: rgba(0,0,0,0.08); color: inherit; }
.tag-crew         { background: #C8EEE0; color: #085041; }
.tag-multicrew    { background: #E8E6FD; color: #3C3489; font-weight: 900; }
.more-pill { font-size: 10px; color: #aaa; padding: 1px 4px; }
.legend { margin-top: 12px; background: #fff; border-radius: 10px; border: 0.5px solid #e0e0e0; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
.legend-group-label { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
.legend-items { display: flex; gap: 8px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #555; }
.legend-swatch { width: 22px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 100; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 12px; padding: 18px 20px; width: 460px; max-width: 98vw; margin: auto; }
.modal-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2px; }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-jobnum { font-size: 13px; font-weight: 800; color: #1D9E75; margin-bottom: 8px; }
.modal-close { cursor: pointer; color: #888; background: none; border: none; font-size: 20px; padding: 0; line-height: 1; }
.modal-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.modal-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; display: inline-block; }
.modal-field { margin-bottom: 9px; }
.modal-label { font-size: 11px; color: #999; margin-bottom: 2px; display: flex; align-items: center; gap: 3px; }
.modal-value { font-size: 13px; color: #222; line-height: 1.5; }
.approval-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 10px; }
.appr-confirmed    { background: #D5F0E8; color: #085041; border: 1px solid #1D9E75; }
.appr-not-approved { background: #FDE6D8; color: #712B13; border: 1px solid #D85A30; }
.appr-pending      { background: #f0f0ec; color: #888; border: 1px solid #ccc; }
.gutter-section { margin-top: 10px; padding: 9px 11px; border-radius: 7px; background: #EAF7F2; }
.gutter-section-title { font-size: 10px; font-weight: 700; color: #1D9E75; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.reroof-section { margin-top: 10px; padding: 9px 11px; border-radius: 7px; }
.reroof-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="logo">Roof<span>Board</span></div>
    <span style="font-size:12px;font-weight:700;color:#fff;background:#1D9E75;padding:2px 8px;border-radius:8px;">Gutters</span>
  </div>
  <div class="controls">
    <select class="rc-filter" id="rc-filter" onchange="renderCalendar()"><option value="">All Consultants</option></select>
    <span class="live-dot"></span>
  </div>
</div>

<div class="crew-tabs" id="crew-tabs"></div>

<div class="cal-header">
  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
    <div class="month-title" id="month-title"></div>
    <button class="nav-btn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="job-count-label" id="job-count"></div>
</div>

<div class="dow-row">
  <div class="dow-cell">Sun</div><div class="dow-cell">Mon</div><div class="dow-cell">Tue</div>
  <div class="dow-cell">Wed</div><div class="dow-cell">Thu</div><div class="dow-cell">Fri</div><div class="dow-cell">Sat</div>
</div>
<div class="cal-grid" id="cal-grid"></div>
<div class="legend" id="legend"></div>

<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-title" id="m-name"></div>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-jobnum" id="m-jobnum"></div>
    <div class="modal-badges" id="m-badges"></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-calendar-check" style="font-size:12px"></i> Customer Approval</div><div class="modal-value" id="m-approval"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-user" style="font-size:12px"></i> Roofing Consultant</div><div class="modal-value" id="m-rc"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-users-group" style="font-size:12px"></i> Gutter Crews</div><div class="modal-value" id="m-crews"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-map-pin" style="font-size:12px"></i> Address</div><div class="modal-value" id="m-addr"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-calendar" style="font-size:12px"></i> Gutter Date</div><div class="modal-value" id="m-gutter-date"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-home" style="font-size:12px"></i> New Roof</div><div class="modal-value" id="m-new-roof"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-home-off" style="font-size:12px"></i> Existing Roof</div><div class="modal-value" id="m-existing-roof"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-notes" style="font-size:12px"></i> Notes</div><div class="modal-value" id="m-notes"></div></div>
    <div class="gutter-section">
      <div class="gutter-section-title"><i class="ti ti-droplet" style="font-size:11px"></i> Gutter Details</div>
      <div class="modal-field" style="margin-bottom:6px;"><div class="modal-label">Profile</div><div class="modal-value" id="m-gprofile"></div></div>
      <div class="modal-field" style="margin-bottom:6px;"><div class="modal-label">Material</div><div class="modal-value" id="m-gmaterial"></div></div>
      <div class="modal-field" id="m-gscreen-f" style="margin-bottom:6px;display:none;"><div class="modal-label">Screen</div><div class="modal-value" id="m-gscreen"></div></div>
      <div class="modal-field" style="margin-bottom:0;"><div class="modal-label">Materials / notes</div><div class="modal-value" id="m-gmat"></div></div>
    </div>
    <div class="reroof-section" id="m-reroof-section" style="display:none">
      <div class="reroof-section-title" id="m-reroof-title"></div>
      <div class="modal-field" style="margin-bottom:5px;"><div class="modal-label">Roof type</div><div class="modal-value" id="m-reroof-type"></div></div>
      <div class="modal-field" style="margin-bottom:0;"><div class="modal-label">Tearoff date</div><div class="modal-value" id="m-reroof-date"></div></div>
    </div>
  </div>
</div>

<script>
const TODAY=new Date();
let viewYear=TODAY.getFullYear(), viewMonth=TODAY.getMonth();
let activeCrew='all';
let allJobs=[], consultants=[], roofMaterials=[], gutterCrews=[];

async function apiFetch(path){ const r=await fetch(RB_API+path); if(!r.ok)throw new Error('API '+r.status); return r.json(); }

async function loadAll(){
  try {
    [consultants,roofMaterials,gutterCrews]=await Promise.all([
      apiFetch('/api/consultants'),
      apiFetch('/api/roof-materials'),
      apiFetch('/api/crews?type=gutter'),
    ]);
    const sel=document.getElementById('rc-filter');
    sel.innerHTML='<option value="">All Consultants</option>';
    consultants.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
    renderCrewTabs();
    await loadJobs();
  } catch(e){ console.error(e); }
}

async function loadJobs(){
  try {
    const jobs=await apiFetch('/api/jobs?view=gutters');
    allJobs=jobs.map(j=>{
      const gutterDate=j.gutterDate?new Date(j.gutterDate+'T00:00:00'):null;
      const nm=roofMaterials.find(m=>m.id===j.newRoofMaterialId);
      let kind='reroofWaiting';
      if(!nm||['Gutters Only'].includes(nm.name)) kind='gutterOnly';
      else if(j.reroofComplete) kind='reroofReady';
      return {...j,gutterDate,kind,nm};
    }).filter(j=>j.gutterDate);
    renderCalendar();
  } catch(e){ console.error(e); }
}
setInterval(loadJobs,30000);

function getMat(id){ return roofMaterials.find(m=>m.id===id)||null; }
function rcInitials(id){ if(!id)return''; const c=consultants.find(x=>x.id===id); return c?c.initials:''; }
function rcName(id){ if(!id)return'—'; const c=consultants.find(x=>x.id===id); return c?c.name:'—'; }
function crewNames(ids){ if(!ids||!ids.length)return'Unassigned'; return ids.map(id=>{ const c=gutterCrews.find(x=>x.id===id); return c?c.name:id; }).join(', '); }
function sameDay(a,b){ return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function getPillStyle(job){ const nm=getMat(job.newRoofMaterialId); if(!nm||job.kind==='gutterOnly')return{bg:'#D0F0E8',text:'#064D38',border:'#0F9E75'}; return{bg:nm.colorBg,text:nm.colorText,border:nm.colorBorder}; }

function renderCrewTabs(){
  const allActive=activeCrew==='all';
  let html=`<button class="crew-btn${allActive?' active':''}" style="${allActive?'background:#444;color:#fff;border-color:#444':''}" onclick="selectCrew('all')">All Crews</button>`;
  html+=gutterCrews.map(c=>{
    const isActive=activeCrew===c.id;
    return `<button class="crew-btn${isActive?' active':''}" style="${isActive?'background:#1D9E75;color:#fff;border-color:#1D9E75':''}" onclick="selectCrew('${c.id}')">${c.name}</button>`;
  }).join('');
  document.getElementById('crew-tabs').innerHTML=html;
}

function renderCalendar(){
  const rcFilter=document.getElementById('rc-filter').value;
  let jobs=allJobs;
  if(activeCrew!=='all') jobs=jobs.filter(j=>j.gutterCrewIds&&j.gutterCrewIds.includes(activeCrew));
  if(rcFilter) jobs=jobs.filter(j=>j.consultantId===rcFilter);

  const firstDay=new Date(viewYear,viewMonth,1), lastDay=new Date(viewYear,viewMonth+1,0);
  document.getElementById('month-title').textContent=firstDay.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const monthJobs=jobs.filter(j=>j.gutterDate&&j.gutterDate.getFullYear()===viewYear&&j.gutterDate.getMonth()===viewMonth);
  document.getElementById('job-count').textContent=monthJobs.length+' jobs';

  const startDow=firstDay.getDay(), cells=[];
  for(let i=0;i<startDow;i++) cells.push({date:new Date(viewYear,viewMonth,i-startDow+1),other:true});
  for(let d=1;d<=lastDay.getDate();d++) cells.push({date:new Date(viewYear,viewMonth,d),other:false});
  while(cells.length%7!==0) cells.push({date:new Date(viewYear,viewMonth+1,cells.length-lastDay.getDate()-startDow+1),other:true});

  const MAX=3;
  document.getElementById('cal-grid').innerHTML=cells.map(cell=>{
    const isToday=sameDay(cell.date,TODAY), isWeekend=cell.date.getDay()===0||cell.date.getDay()===6;
    let dayJobs=jobs.filter(j=>sameDay(j.gutterDate,cell.date));
    // Deduplicate on All tab
    if(activeCrew==='all'){ const seen=new Set(); dayJobs=dayJobs.filter(j=>{ if(seen.has(j.id))return false; seen.add(j.id); return true; }); }
    const shown=dayJobs.slice(0,MAX), extra=dayJobs.length-MAX;
    const pills=shown.map(j=>{
      const style=getPillStyle(j);
      const isWaiting=j.kind==='reroofWaiting';
      const notApproved=j.startDateApproval==='not_approved';
      const statusIcon=j.kind==='reroofReady'?'✓ ':j.kind==='reroofWaiting'?'⏳ ':'';
      const gp=GUTTER_PROFILES[j.gutterProfile];
      const gm=GUTTER_MATERIALS_MAP[j.gutterMaterial];
      const profileTag=gp?`<span class="ptag tag-profile">${gp.short}${gm?' '+gm.short:''}</span>`:'';
      const appr=rbApprovalInfo(j.startDateApproval);
      const em=getMat(j.existingRoofMaterialId);
      const rc=rcInitials(j.consultantId);
      const isMultiCrew=j.gutterCrewIds&&j.gutterCrewIds.length>1;
      return `<div class="job-pill${isWaiting?' waiting':''}${notApproved?' not-approved':''}" style="background:${style.bg};color:${style.text};border-left-color:${style.border}" onclick="openJob('${j.id}')">
        <div class="pill-r1"><span class="pill-num">${j.jobNum}</span><span class="pill-name">${statusIcon}${j.customer}</span></div>
        <div class="pill-r2">
          ${j.steepPitch?'<span class="ptag tag-steep">⚠STEEP</span>':''}
          ${isMultiCrew?`<span class="ptag tag-multicrew">×${j.gutterCrewIds.length}crews</span>`:''}
          ${profileTag}
          <span class="ptag ${appr.cls}">${appr.label}</span>
          ${em?`<span class="ptag tag-existing">Rem:${em.name}</span>`:''}
          ${rc?`<span class="ptag tag-rc">${rc}</span>`:''}
          ${activeCrew==='all'?`<span class="ptag tag-crew">${crewNames(j.gutterCrewIds)}</span>`:''}
        </div>
      </div>`;
    }).join('');
    const morePill=extra>0?`<div class="more-pill">+${extra} more</div>`:'';
    return `<div class="cal-day${cell.other?' other-month':''}${isToday?' today':''}${isWeekend&&!cell.other?' weekend':''}">
      <div class="day-num">${cell.date.getDate()}</div>${pills}${morePill}</div>`;
  }).join('');
  renderLegend();
}

function renderLegend(){
  const matItems=roofMaterials.map(m=>`<div class="legend-item"><div class="legend-swatch" style="background:${m.colorBg};border:1.5px solid ${m.colorBorder}"></div><span>${m.name}</span></div>`).join('');
  const profileItems=Object.entries(GUTTER_PROFILES).map(([k,v])=>`<div class="legend-item"><span class="ptag tag-profile" style="font-size:10px;padding:2px 6px;">${v.short}</span><span>${v.label}</span></div>`).join('');
  const indicators=`
    <div class="legend-item"><span class="ptag tag-steep" style="font-size:10px;padding:2px 6px;">⚠STEEP</span><span>7:12+ pitch</span></div>
    <div class="legend-item"><span class="ptag tag-multicrew" style="font-size:10px;padding:2px 6px;">×2crews</span><span>Multiple crews</span></div>
    <div class="legend-item"><span class="ptag tag-confirmed" style="font-size:10px;padding:2px 6px;">✓ Confirmed</span><span>Customer approved</span></div>
    <div class="legend-item"><span class="ptag tag-not-approved" style="font-size:10px;padding:2px 6px;">✗ Not Approved</span><span>Red border</span></div>
    <div class="legend-item"><span class="ptag tag-crew" style="font-size:10px;padding:2px 6px;">Crew name</span><span>Shown on All Crews tab</span></div>`;
  document.getElementById('legend').innerHTML=`
    <div><div class="legend-group-label">New roof type (pill color)</div><div class="legend-items">${matItems}</div></div>
    <div><div class="legend-group-label">Gutter profiles</div><div class="legend-items">${profileItems}</div></div>
    <div><div class="legend-group-label">Indicators</div><div class="legend-items">${indicators}</div></div>`;
}

function openJob(id){
  const job=allJobs.find(j=>j.id===id); if(!job)return;
  const nm=getMat(job.newRoofMaterialId), em=getMat(job.existingRoofMaterialId);
  const style=getPillStyle(job);
  const gp=GUTTER_PROFILES[job.gutterProfile], gm=GUTTER_MATERIALS_MAP[job.gutterMaterial];
  document.getElementById('m-name').textContent=job.customer;
  document.getElementById('m-jobnum').textContent='Job '+job.jobNum;
  let badges=nm?`<span class="modal-badge" style="background:${style.bg};color:${style.text};border:1px solid ${style.border}">${nm.name}</span>`:'';
  if(job.steepPitch) badges+=`<span class="modal-badge" style="background:#FEF0E0;color:#A04000;border:1px solid #F0A500">⚠ STEEP 7:12+</span>`;
  if(gp) badges+=`<span class="modal-badge" style="background:${gm?gm.bg:'#EAF7F2'};color:${gm?gm.text:'#0F6E56'}">${gp.label}${gm?' · '+gm.label:''}</span>`;
  if(job.kind==='reroofReady') badges+=`<span class="modal-badge" style="background:#C8EEE0;color:#085041;border:1px solid #1D9E75">✓ Reroof done</span>`;
  else if(job.kind==='reroofWaiting') badges+=`<span class="modal-badge" style="background:#EEF6F2;color:#5A9E82;border:1px dashed #A8D9C4">⏳ Awaiting reroof</span>`;
  if(job.gutterCrewIds&&job.gutterCrewIds.length>1) badges+=`<span class="modal-badge" style="background:#E8E6FD;color:#3C3489;">×${job.gutterCrewIds.length} crews</span>`;
  document.getElementById('m-badges').innerHTML=badges;
  const appr=rbApprovalInfo(job.startDateApproval);
  document.getElementById('m-approval').innerHTML=`<span class="approval-badge ${appr.fullCls}">${appr.label}</span>`;
  document.getElementById('m-rc').textContent=rcName(job.consultantId);
  document.getElementById('m-crews').textContent=crewNames(job.gutterCrewIds);
  document.getElementById('m-addr').textContent=job.address||'—';
  document.getElementById('m-gutter-date').textContent=rbFmtFull(job.gutterDate);
  document.getElementById('m-new-roof').textContent=nm?nm.name:'—';
  document.getElementById('m-existing-roof').textContent=em?em.name:'—';
  document.getElementById('m-notes').textContent=job.notes||'—';
  document.getElementById('m-gprofile').textContent=gp?gp.label:'—';
  document.getElementById('m-gmaterial').textContent=gm?gm.label:'—';
  const gsf=document.getElementById('m-gscreen-f');
  if(job.gutterScreen){gsf.style.display='block';document.getElementById('m-gscreen').textContent=job.gutterScreen;}
  else gsf.style.display='none';
  document.getElementById('m-gmat').textContent=job.gutterMaterials||'—';
  const rs=document.getElementById('m-reroof-section');
  if(job.kind!=='gutterOnly'){
    rs.style.display='block'; rs.style.background=job.kind==='reroofReady'?'#EAF7F2':'#F5FAF8';
    const titleEl=document.getElementById('m-reroof-title');
    titleEl.textContent=job.kind==='reroofReady'?'✓ Reroof completed':'⏳ Reroof scheduled (pending)';
    titleEl.style.color=job.kind==='reroofReady'?'#1D9E75':'#5A9E82';
    document.getElementById('m-reroof-type').textContent=nm?nm.name:'—';
    document.getElementById('m-reroof-date').textContent=rbFmtD(job.tearoffDate);
  } else rs.style.display='none';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
function handleOverlayClick(e){ if(e.target===document.getElementById('modal-overlay'))closeModal(); }
function changeMonth(dir){ viewMonth+=dir; if(viewMonth>11){viewMonth=0;viewYear++;} if(viewMonth<0){viewMonth=11;viewYear--;} renderCalendar(); }
function selectCrew(id){ activeCrew=id; renderCrewTabs(); renderCalendar(); }

loadAll();
</script>
</body>
