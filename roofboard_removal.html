<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoofBoard — Removal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="roofboard_config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; min-height: 100vh; padding: 12px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #fff; border-radius: 10px; border: 0.5px solid #e0e0e0; padding: 9px 14px; flex-wrap: wrap; gap: 6px; }
.logo { font-size: 17px; font-weight: 600; letter-spacing: -0.5px; }
.logo span { color: #D85A30; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #1D9E75; display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
select.rc-filter { padding: 5px 10px; border: 0.5px solid #d0d0cc; border-radius: 8px; font-size: 12px; font-family: inherit; background: #f8f8f5; color: #111; outline: none; cursor: pointer; }
.crew-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.crew-btn { padding: 5px 13px; border-radius: 18px; border: 0.5px solid #ccc; background: #f0f0ec; font-size: 12px; color: #555; cursor: pointer; font-family: inherit; }
.crew-btn.active { color: #fff; border-color: transparent; font-weight: 600; }
.main-layout { display: grid; grid-template-columns: 1fr 280px; gap: 10px; align-items: start; }
@media(max-width:700px){ .main-layout { grid-template-columns: 1fr; } }
.cal-panel { background: #fff; border-radius: 10px; border: 0.5px solid #e0e0e0; padding: 12px; }
.panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
.panel-title { font-size: 13px; font-weight: 600; color: #111; display: flex; align-items: center; gap: 5px; }
.week-nav { display: flex; align-items: center; gap: 6px; }
.nav-btn { width: 27px; height: 27px; border-radius: 7px; border: 0.5px solid #ccc; background: #f0f0ec; color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; font-size: 14px; }
.nav-btn:hover { background: #fff; }
.week-range { font-size: 12px; color: #888; min-width: 150px; text-align: center; }
.week-block { margin-bottom: 14px; }
.week-label { font-size: 10px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.6px; padding: 3px 0; margin-bottom: 3px; border-bottom: 0.5px solid #f0f0ec; }
.day-row { display: grid; grid-template-columns: 65px 1fr; gap: 6px; min-height: 50px; margin-bottom: 3px; align-items: stretch; }
.day-label-cell { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding-right: 8px; border-right: 2px solid #f0f0ec; }
.day-label-cell.today-col { border-right-color: #D85A30; }
.day-name { font-size: 10px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.3px; }
.day-date { font-size: 15px; font-weight: 700; color: #aaa; line-height: 1.1; }
.day-label-cell.today-col .day-date { color: #D85A30; }
.day-jobs { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; justify-content: center; }
.empty-slot { background: #f8f8f5; border-radius: 5px; height: 36px; border: 0.5px dashed #e4e4e0; }
.job-card { border-radius: 5px; padding: 4px 8px; cursor: pointer; border-left: 4px solid transparent; }
.job-card:hover { opacity: 0.78; }
.job-card.not-approved { outline: 2px solid #D85A30; outline-offset: -1px; }
.jc-r1 { display: flex; align-items: center; gap: 5px; }
.jc-num { font-size: 9px; font-weight: 800; opacity: 0.6; flex-shrink: 0; }
.jc-name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.jc-r2 { display: flex; gap: 3px; margin-top: 2px; flex-wrap: wrap; }
.ptag { font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
.tag-confirmed    { background: #D5F0E8; color: #085041; }
.tag-not-approved { background: #FDE6D8; color: #712B13; }
.tag-pending      { background: #f0f0ec; color: #999; }
.tag-rc           { background: #EAF2FB; color: #185FA5; }
.tag-steep        { background: #FEF0E0; color: #A04000; border: 1px solid #F0A500; }
.tag-existing     { background: rgba(0,0,0,0.08); color: inherit; }
.tag-deck         { background: rgba(0,0,0,0.06); color: inherit; font-style: italic; }
.tag-crew         { background: #FAE0E0; color: #791F1F; }
.tag-multicrew    { background: #E8E6FD; color: #3C3489; font-weight: 900; }
.tag-squares      { background: #D85A30; color: #fff; font-weight: 900; }
.backlog-panel { background: #fff; border-radius: 10px; border: 0.5px solid #e0e0e0; padding: 12px; }
.backlog-count { font-size: 10px; color: #888; background: #f0f0ec; padding: 2px 8px; border-radius: 8px; }
.backlog-section-label { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.6px; padding: 6px 0 4px; border-bottom: 0.5px solid #f0f0ec; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
.backlog-scroll { display: flex; flex-direction: column; max-height: 650px; overflow-y: auto; margin-top: 6px; }
.backlog-item { border-radius: 7px; padding: 8px 10px; cursor: pointer; border-left: 4px solid transparent; margin-bottom: 3px; }
.backlog-item:hover { opacity: 0.78; }
.backlog-item.not-approved { outline: 2px solid #D85A30; outline-offset: -1px; }
.bi-r1 { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.bi-num { font-size: 10px; font-weight: 800; opacity: 0.7; flex-shrink: 0; }
.bi-name { font-size: 12px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bi-r2 { font-size: 10px; opacity: 0.75; }
.bi-r3 { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
.legend { margin-top: 10px; background: #fff; border-radius: 10px; border: 0.5px solid #e0e0e0; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.legend-group-label { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
.legend-items { display: flex; gap: 8px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #555; }
.legend-swatch { width: 22px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 12px; padding: 18px 20px; width: 440px; max-width: 96vw; max-height: 90vh; overflow-y: auto; }
.modal-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2px; }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-jobnum { font-size: 13px; font-weight: 800; color: #D85A30; margin-bottom: 8px; }
.modal-close { cursor: pointer; color: #888; background: none; border: none; font-size: 20px; padding: 0; line-height: 1; }
.modal-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.modal-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; display: inline-block; }
.modal-field { margin-bottom: 9px; }
.modal-label { font-size: 11px; color: #999; margin-bottom: 2px; display: flex; align-items: center; gap: 3px; }
.modal-value { font-size: 13px; color: #222; line-height: 1.5; }
.approval-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 10px; }
.appr-confirmed    { background: #D5F0E8; color: #085041; border: 1px solid #1D9E75; }
.appr-not-approved { background: #FDE6D8; color: #712B13; border: 1px solid #D85A30; }
.appr-pending      { background: #f0f0ec; color: #888; border: 1px solid #ccc; }
.gutter-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 9px; }
.gutter-remove { background: #FDE6D8; color: #712B13; border: 1px solid #E8856A; }
.gutter-keep   { background: #DCF0CC; color: #27500A; border: 1px solid #639922; }
.gutter-na     { background: #f0f0ec; color: #999; border: 1px solid #ddd; }
.layers-section { margin-top: 12px; padding-top: 12px; border-top: 1.5px solid #f0f0ec; }
.layers-title { font-size: 11px; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
.layers-title i { color: #D85A30; }
.layer-row-item { display: grid; grid-template-columns: 80px 1fr; gap: 6px; align-items: center; margin-bottom: 3px; }
.layer-pos-lbl { font-size: 10px; color: #999; text-align: right; padding-right: 4px; }
.layer-arrow { padding: 1px 0 1px 84px; color: #ccc; font-size: 10px; }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="logo">Roof<span>Board</span></div>
    <span style="font-size:12px;font-weight:700;color:#fff;background:#D85A30;padding:2px 8px;border-radius:8px;">Removal</span>
  </div>
  <div class="controls">
    <select class="rc-filter" id="rc-filter" onchange="renderTwoWeek();renderBacklog()"><option value="">All Consultants</option></select>
    <span class="live-dot"></span>
  </div>
</div>

<div class="crew-tabs" id="crew-tabs"></div>

<div class="main-layout">
  <div class="cal-panel">
    <div class="panel-header">
      <div class="panel-title"><i class="ti ti-calendar" style="font-size:14px;color:#D85A30"></i> Scheduled Tear-offs</div>
      <div class="week-nav">
        <button class="nav-btn" onclick="changeWeek(-1)"><i class="ti ti-chevron-left"></i></button>
        <div class="week-range" id="week-range"></div>
        <button class="nav-btn" onclick="changeWeek(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
    <div id="two-week-grid"></div>
  </div>
  <div class="backlog-panel">
    <div class="panel-header">
      <div class="panel-title"><i class="ti ti-list" style="font-size:14px;color:#D85A30"></i> Backlog</div>
      <div class="backlog-count" id="backlog-count">0 pending</div>
    </div>
    <div class="backlog-scroll" id="backlog-scroll"></div>
  </div>
</div>

<div class="legend" id="legend"></div>

<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-title" id="m-name"></div>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-jobnum" id="m-jobnum"></div>
    <div class="modal-badges" id="m-badges"></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-calendar-check" style="font-size:12px"></i> Customer Approval</div><div class="modal-value" id="m-approval"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-user" style="font-size:12px"></i> Roofing Consultant</div><div class="modal-value" id="m-rc"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-users-group" style="font-size:12px"></i> Removal Crews</div><div class="modal-value" id="m-crews"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-map-pin" style="font-size:12px"></i> Address</div><div class="modal-value" id="m-addr"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-hammer" style="font-size:12px"></i> Tear-off Date</div><div class="modal-value" id="m-tearoff"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-calendar" style="font-size:12px"></i> Install Date</div><div class="modal-value" id="m-install"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-home" style="font-size:12px"></i> New Roof</div><div class="modal-value" id="m-new-roof"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-home-off" style="font-size:12px"></i> Existing Roof</div><div class="modal-value" id="m-existing-roof"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-layers" style="font-size:12px"></i> Deck (Existing → New)</div><div class="modal-value" id="m-deck"></div></div>
    <div class="modal-field" id="m-existing-notes-f" style="display:none;"><div class="modal-label">Existing Roof Notes</div><div class="modal-value" id="m-existing-notes"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-package" style="font-size:12px"></i> Materials</div><div class="modal-value" id="m-mat"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-ruler-2" style="font-size:12px"></i> Squares</div><div class="modal-value" id="m-squares"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-droplet" style="font-size:12px"></i> Gutters</div><div class="modal-value" id="m-gutters"></div></div>
    <div class="modal-field"><div class="modal-label"><i class="ti ti-notes" style="font-size:12px"></i> Tear-off Notes</div><div class="modal-value" id="m-notes"></div></div>
    <div class="layers-section">
      <div class="layers-title"><i class="ti ti-stack-2"></i> Roof Layers</div>
      <div id="layer-stack"></div>
    </div>
  </div>
</div>

<script>
const TODAY=new Date();
let weekOffset=0, activeCrew='all', activeJobId=null;
let allJobs=[], consultants=[], roofMaterials=[], removalCrews=[];

const CACHE_KEY='rb_removal_cache';

async function apiFetch(path){ const r=await fetch(RB_API+path); if(!r.ok)throw new Error('API '+r.status); return r.json(); }

function saveCache(){ try{ localStorage.setItem(CACHE_KEY,JSON.stringify({jobs:allJobs,consultants,roofMaterials,removalCrews,savedAt:new Date().toISOString()})); }catch(e){} }
function loadCache(){ try{ const c=localStorage.getItem(CACHE_KEY); return c?JSON.parse(c):null; }catch(e){ return null; } }
function showBanner(savedAt){
  let el=document.getElementById('offline-banner');
  if(!el){ el=document.createElement('div'); el.id='offline-banner'; el.style.cssText='background:#F0A500;color:#fff;font-size:12px;font-weight:700;text-align:center;padding:7px 14px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;'; document.querySelector('.main-layout').before(el); }
  const t=savedAt?new Date(savedAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'unknown time';
  el.innerHTML=`<i class="ti ti-wifi-off" style="font-size:14px"></i> Server unreachable — showing last saved schedule from ${t}. Retrying automatically…`;
}
function hideBanner(){ const el=document.getElementById('offline-banner'); if(el) el.remove(); }

function parseJobs(jobs){ return (jobs||[]).map(j=>({...j,tearOffDate:j.tearoffDate?new Date(j.tearoffDate+'T00:00:00'):null,installDateObj:j.installDate?new Date(j.installDate+'T00:00:00'):null,isScheduled:!!j.tearoffDate})); }

async function loadAll(){
  try {
    [consultants,roofMaterials,removalCrews]=await Promise.all([
      apiFetch('/api/consultants'),
      apiFetch('/api/roof-materials'),
      apiFetch('/api/crews?type=removal'),
    ]);
    const sel=document.getElementById('rc-filter');
    sel.innerHTML='<option value="">All Consultants</option>';
    consultants.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
    renderCrewTabs();
    await loadJobs();
  } catch(e){
    console.error(e);
    const cache=loadCache();
    if(cache){
      consultants=cache.consultants||[]; roofMaterials=cache.roofMaterials||[]; removalCrews=cache.removalCrews||[];
      allJobs=parseJobs(cache.jobs);
      const sel=document.getElementById('rc-filter'); sel.innerHTML='<option value="">All Consultants</option>'; consultants.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
      renderCrewTabs(); renderTwoWeek(); renderBacklog(); renderLegend(); showBanner(cache.savedAt);
    }
  }
}

async function loadJobs(){
  try {
    const raw=await apiFetch('/api/jobs');
    allJobs=parseJobs(raw);
    saveCache(); hideBanner(); renderTwoWeek(); renderBacklog(); renderLegend();
  } catch(e){
    console.error(e);
    const cache=loadCache();
    if(cache){ allJobs=parseJobs(cache.jobs); showBanner(cache.savedAt); renderTwoWeek(); renderBacklog(); }
  }
}
setInterval(loadJobs,30000);

function getMat(id){ return roofMaterials.find(m=>m.id===id)||null; }
function rcInitials(id){ if(!id)return''; const c=consultants.find(x=>x.id===id); return c?c.initials:''; }
function rcName(id){ if(!id)return'—'; const c=consultants.find(x=>x.id===id); return c?c.name:'—'; }
function crewNames(ids){ if(!ids||!ids.length)return'Unassigned'; return ids.map(id=>{ const c=removalCrews.find(x=>x.id===id); return c?c.name:id; }).join(', '); }
function sameDay(a,b){ return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function fmtShort(d){ return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'—'; }

function renderCrewTabs(){
  const allActive=activeCrew==='all';
  let html=`<button class="crew-btn${allActive?' active':''}" style="${allActive?'background:#444;color:#fff;border-color:#444':''}" onclick="selectCrew('all')">All Crews</button>`;
  html+=removalCrews.map(c=>{
    const isActive=activeCrew===c.id;
    return `<button class="crew-btn${isActive?' active':''}" style="${isActive?'background:#D85A30;color:#fff;border-color:#D85A30':''}" onclick="selectCrew('${c.id}')">${c.name}</button>`;
  }).join('');
  document.getElementById('crew-tabs').innerHTML=html;
}

function getFilteredJobs(scheduled){
  const rcFilter=document.getElementById('rc-filter').value;
  let jobs=allJobs.filter(j=>j.isScheduled===scheduled);
  if(activeCrew!=='all') jobs=jobs.filter(j=>j.removalCrewIds&&j.removalCrewIds.includes(activeCrew));
  if(rcFilter) jobs=jobs.filter(j=>j.consultantId===rcFilter);
  return jobs;
}

function getWeekStart(){
  const d=new Date(TODAY), dow=d.getDay(), mon=new Date(d);
  mon.setDate(d.getDate()-(dow===0?6:dow-1)+weekOffset*14);
  return mon;
}

function renderTwoWeek(){
  const ws=getWeekStart(), we=new Date(ws); we.setDate(ws.getDate()+13);
  document.getElementById('week-range').textContent=fmtShort(ws)+' – '+fmtShort(we);
  let scheduled=getFilteredJobs(true);
  const workdays=[];
  for(let i=0;i<14;i++){ const d=new Date(ws); d.setDate(ws.getDate()+i); if(d.getDay()!==0&&d.getDay()!==6)workdays.push(d); }
  const w1=workdays.slice(0,5), w2=workdays.slice(5,10);

  function buildWeek(days){
    const wl=`<div class="week-label">Week of ${fmtShort(days[0])}</div>`;
    const rows=days.map(day=>{
      const isToday=sameDay(day,TODAY);
      let dayJobs=scheduled.filter(j=>sameDay(j.tearOffDate,day));
      // Deduplicate on All tab
      if(activeCrew==='all'){ const seen=new Set(); dayJobs=dayJobs.filter(j=>{ if(seen.has(j.id))return false; seen.add(j.id); return true; }); }
      const jobsHtml=dayJobs.length===0?'<div class="empty-slot"></div>':dayJobs.map(j=>{
        const nm=getMat(j.newRoofMaterialId), em=getMat(j.existingRoofMaterialId);
        const bg=nm?nm.colorBg:'#f0f0ec', text=nm?nm.colorText:'#888', border=nm?nm.colorBorder:'#ccc';
        const appr=rbApprovalInfo(j.startDateApproval);
        const notApproved=j.startDateApproval==='not_approved';
        const rc=rcInitials(j.consultantId);
        const isMultiCrew=j.removalCrewIds&&j.removalCrewIds.length>1;
        return `<div class="job-card${notApproved?' not-approved':''}" style="background:${bg};color:${text};border-left-color:${border}" onclick="openJob('${j.id}')">
          <div class="jc-r1"><span class="jc-num">${j.jobNum}</span><span class="jc-name">${j.customer}</span></div>
          <div class="jc-r2">
            ${j.steepPitch?'<span class="ptag tag-steep">⚠STEEP</span>':''}
            ${isMultiCrew?`<span class="ptag tag-multicrew">×${j.removalCrewIds.length}crews</span>`:''}
            ${j.squares?`<span class="ptag tag-squares">${j.squares}sq</span>`:''}
            <span class="ptag ${appr.cls}">${appr.label}</span>
            ${em?`<span class="ptag tag-existing">Rem:${em.name}</span>`:''}
            ${j.existingDeckType?`<span class="ptag tag-deck">${rbDeckLabel(j.existingDeckType)}</span>`:''}
            ${rc?`<span class="ptag tag-rc">${rc}</span>`:''}
            ${activeCrew==='all'?`<span class="ptag tag-crew">${crewNames(j.removalCrewIds)}</span>`:''}
          </div>
        </div>`;
      }).join('');
      return `<div class="day-row">
        <div class="day-label-cell${isToday?' today-col':''}">
          <div class="day-name">${day.toLocaleDateString('en-US',{weekday:'short'})}</div>
          <div class="day-date">${day.getDate()}</div>
        </div>
        <div class="day-jobs">${jobsHtml}</div>
      </div>`;
    }).join('');
    return `<div class="week-block">${wl}${rows}</div>`;
  }
  document.getElementById('two-week-grid').innerHTML=buildWeek(w1)+buildWeek(w2);
}

function renderBacklog(){
  const rcFilter=document.getElementById('rc-filter').value;
  let backlog=allJobs.filter(j=>!j.isScheduled);
  if(activeCrew!=='all') backlog=backlog.filter(j=>!j.removalCrewIds||j.removalCrewIds.length===0||j.removalCrewIds.includes(activeCrew));
  if(rcFilter) backlog=backlog.filter(j=>j.consultantId===rcFilter);
  // Deduplicate
  const seen=new Set(); backlog=backlog.filter(j=>{ if(seen.has(j.id))return false; seen.add(j.id); return true; });
  document.getElementById('backlog-count').textContent=backlog.length+' pending';

  const regular=backlog.filter(j=>j.backlogCategory==='regular'||!j.backlogCategory);
  const onHold=backlog.filter(j=>j.backlogCategory==='on_hold');
  const byMonth=backlog.filter(j=>MONTH_ORDER.includes(j.backlogCategory));
  function sortByJob(arr){ return arr.sort((a,b)=>{ const na=parseInt((a.jobNum||'0').replace(/\D/g,'')),nb=parseInt((b.jobNum||'0').replace(/\D/g,'')); return na-nb; }); }
  sortByJob(regular); sortByJob(onHold);
  const now=new Date(), nextMonthIdx=(now.getMonth()+1)%12;
  const orderedMonths=[], monthGroups={};
  for(let i=0;i<12;i++) orderedMonths.push(MONTH_ORDER[(nextMonthIdx+i)%12]);
  byMonth.forEach(j=>{ if(!monthGroups[j.backlogCategory])monthGroups[j.backlogCategory]=[]; monthGroups[j.backlogCategory].push(j); });
  orderedMonths.forEach(m=>{ if(monthGroups[m])sortByJob(monthGroups[m]); });

  function renderItem(j){
    const nm=getMat(j.newRoofMaterialId), em=getMat(j.existingRoofMaterialId);
    const bg=nm?nm.colorBg:'#f0f0ec', text=nm?nm.colorText:'#888', border=nm?nm.colorBorder:'#ccc';
    const appr=rbApprovalInfo(j.startDateApproval);
    const notApproved=j.startDateApproval==='not_approved';
    const rc=rcInitials(j.consultantId);
    const isMultiCrew=j.removalCrewIds&&j.removalCrewIds.length>1;
    return `<div class="backlog-item${notApproved?' not-approved':''}" style="background:${bg};color:${text};border-left-color:${border}" onclick="openJob('${j.id}')">
      <div class="bi-r1"><span class="bi-num">${j.jobNum}</span><span class="bi-name">${j.customer}</span></div>
      <div class="bi-r2"><i class="ti ti-map-pin" style="font-size:9px"></i> ${j.address||'No address'} · ${nm?nm.name:'?'}</div>
      <div class="bi-r3">
        ${j.steepPitch?'<span class="ptag tag-steep">⚠STEEP</span>':''}
        ${isMultiCrew?`<span class="ptag tag-multicrew">×${j.removalCrewIds.length}crews</span>`:''}
        ${j.squares?`<span class="ptag tag-squares">${j.squares}sq</span>`:''}
        <span class="ptag ${appr.cls}">${appr.label}</span>
        ${em?`<span class="ptag tag-existing">Rem:${em.name}</span>`:''}
        ${rc?`<span class="ptag tag-rc">${rc}</span>`:''}
        ${j.installDateObj?`<span style="font-size:9px;opacity:0.7"><i class="ti ti-calendar" style="font-size:9px"></i> Install: ${fmtShort(j.installDateObj)}</span>`:''}
      </div>
    </div>`;
  }

  let html='';
  if(regular.length){ html+=`<div class="backlog-section-label"><i class="ti ti-list" style="font-size:11px"></i> Regular (${regular.length})</div>`; html+=regular.map(renderItem).join(''); }
  orderedMonths.forEach(m=>{ if(monthGroups[m]&&monthGroups[m].length){ const mLabel=BACKLOG_CATEGORIES.find(c=>c.value===m)?.label||m; html+=`<div class="backlog-section-label"><i class="ti ti-calendar" style="font-size:11px"></i> ${mLabel} (${monthGroups[m].length})</div>`; html+=monthGroups[m].map(renderItem).join(''); } });
  if(onHold.length){ html+=`<div class="backlog-section-label"><i class="ti ti-pause" style="font-size:11px"></i> On Hold (${onHold.length})</div>`; html+=onHold.map(renderItem).join(''); }
  if(!html) html='<div style="font-size:12px;color:#ccc;text-align:center;padding:20px 0;">No pending jobs</div>';
  document.getElementById('backlog-scroll').innerHTML=html;
}

function renderLegend(){
  const matItems=roofMaterials.map(m=>`<div class="legend-item"><div class="legend-swatch" style="background:${m.colorBg};border:1.5px solid ${m.colorBorder}"></div><span>${m.name}</span></div>`).join('');
  const indicators=`
    <div class="legend-item"><span class="ptag tag-steep" style="font-size:10px;padding:2px 6px;">⚠STEEP</span><span>7:12+ pitch</span></div>
    <div class="legend-item"><span class="ptag tag-multicrew" style="font-size:10px;padding:2px 6px;">×2crews</span><span>Multiple crews</span></div>
    <div class="legend-item"><span class="ptag tag-confirmed" style="font-size:10px;padding:2px 6px;">✓ Confirmed</span><span>Customer approved</span></div>
    <div class="legend-item"><span class="ptag tag-not-approved" style="font-size:10px;padding:2px 6px;">✗ Not Approved</span><span>Red border</span></div>
    <div class="legend-item"><span class="ptag tag-existing" style="font-size:10px;padding:2px 6px;">Rem:Tile</span><span>Existing roof type</span></div>
    <div class="legend-item"><span class="ptag tag-rc" style="font-size:10px;padding:2px 6px;">RC</span><span>Roofing Consultant</span></div>`;
  document.getElementById('legend').innerHTML=`
    <div><div class="legend-group-label">New roof type (pill color)</div><div class="legend-items">${matItems}</div></div>
    <div><div class="legend-group-label">Indicators</div><div class="legend-items">${indicators}</div></div>`;
}

function openJob(id){
  const job=allJobs.find(j=>j.id===id); if(!job)return;
  activeJobId=id;
  const nm=getMat(job.newRoofMaterialId), em=getMat(job.existingRoofMaterialId);
  const bg=nm?nm.colorBg:'#f0f0ec', text=nm?nm.colorText:'#888', border=nm?nm.colorBorder:'#ccc';
  document.getElementById('m-name').textContent=job.customer;
  document.getElementById('m-jobnum').textContent='Job '+job.jobNum;
  let badges=nm?`<span class="modal-badge" style="background:${bg};color:${text};border:1px solid ${border}">${nm.name}</span>`:'';
  if(job.steepPitch) badges+=`<span class="modal-badge" style="background:#FEF0E0;color:#A04000;border:1px solid #F0A500">⚠ STEEP 7:12+</span>`;
  if(job.isScheduled) badges+=`<span class="modal-badge" style="background:#DCF0CC;color:#27500A">Scheduled</span>`;
  else badges+=`<span class="modal-badge" style="background:#FDE6D8;color:#712B13">Backlog</span>`;
  if(job.removalCrewIds&&job.removalCrewIds.length>1) badges+=`<span class="modal-badge" style="background:#E8E6FD;color:#3C3489;">×${job.removalCrewIds.length} crews</span>`;
  document.getElementById('m-badges').innerHTML=badges;
  const appr=rbApprovalInfo(job.startDateApproval);
  document.getElementById('m-approval').innerHTML=`<span class="approval-badge ${appr.fullCls}">${appr.label}</span>`;
  document.getElementById('m-rc').textContent=rcName(job.consultantId);
  document.getElementById('m-crews').textContent=crewNames(job.removalCrewIds);
  document.getElementById('m-addr').textContent=job.address||'—';
  document.getElementById('m-tearoff').textContent=job.tearOffDate?rbFmtFull(job.tearoffDate):'Not yet scheduled';
  document.getElementById('m-install').textContent=rbFmtD(job.installDate);
  document.getElementById('m-new-roof').textContent=nm?nm.name:'—';
  document.getElementById('m-existing-roof').textContent=em?em.name:'—';
  document.getElementById('m-deck').textContent=`${rbDeckLabel(job.existingDeckType)||'Unknown'} → ${rbDeckLabel(job.newDeckType)||'No change'}`;
  const enf=document.getElementById('m-existing-notes-f');
  if(job.existingRoofNotes){enf.style.display='block';document.getElementById('m-existing-notes').textContent=job.existingRoofNotes;}
  else enf.style.display='none';
  document.getElementById('m-mat').textContent=job.materials||'—';
  document.getElementById('m-squares').textContent=job.squares?job.squares+'sq':'—';
  const gi={na:'N/A',remove:'Remove gutters',keep:'Keep gutters'};
  const gc=job.gutterInstruction==='remove'?'gutter-remove':job.gutterInstruction==='keep'?'gutter-keep':'gutter-na';
  document.getElementById('m-gutters').innerHTML=`<span class="gutter-badge ${gc}"><i class="ti ti-droplet" style="font-size:11px"></i> ${gi[job.gutterInstruction]||'N/A'}</span>`;
  document.getElementById('m-notes').textContent=job.tearoffNotes||job.notes||'—';
  // Layer stack — read only
  const layers=job.layerStack&&job.layerStack.length?job.layerStack:[job.newRoofMaterialId||''];
  document.getElementById('layer-stack').innerHTML=layers.map((matId,idx)=>{
    const m=getMat(matId);
    const pos=layers.length===1?'Only layer':idx===0?'Top layer':idx===layers.length-1?'Bottom layer':`Layer ${idx+1}`;
    const arrow=idx>0?`<div class="layer-arrow"><i class="ti ti-arrow-down"></i></div>`:'';
    return `${arrow}<div class="layer-row-item"><div class="layer-pos-lbl">${pos}</div><div style="font-size:13px;color:#222;padding:4px 0;">${m?m.name:'—'}</div></div>`;
  }).join('');
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); activeJobId=null; }
function handleOverlayClick(e){ if(e.target===document.getElementById('modal-overlay'))closeModal(); }
function changeWeek(dir){ weekOffset+=dir; renderTwoWeek(); }
function selectCrew(id){ activeCrew=id; renderCrewTabs(); renderTwoWeek(); renderBacklog(); }

loadAll();
</script>
